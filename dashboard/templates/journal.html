{% extends "base.html" %}
{% block title %}Journal — AlphaSignal{% endblock %}

{% block content %}
<div class="card mb-3">
    <h2 class="font-semibold mb-2 text-sm">Historique des signaux et trades</h2>
    <div class="text-xs text-slate-400">
        Combine les signaux émis (technique) avec les positions paper (ouvertes/fermées).
    </div>
</div>

<div id="journal" class="space-y-3">
    <div class="skeleton h-20"></div>
    <div class="skeleton h-20"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
const pct = (v) => (v == null) ? "—" : (v >= 0 ? "+" : "") + v.toFixed(2) + "%";
const colorPnl = (v) => v >= 0 ? "text-emerald-400" : "text-red-400";

async function load() {
    const data = await (await fetch("/api/journal?limit=50")).json();
    const el = document.getElementById("journal");
    if (!data.length) {
        el.innerHTML = `<div class="card text-center text-slate-400 py-6">Aucun signal dans le journal</div>`;
        return;
    }
    el.innerHTML = data.map(j => {
        const fermeture = j.exit_price !== null;
        const pnl = j.pnl_pct;
        return `
        <div class="card">
            <div class="flex justify-between items-start mb-2">
                <div>
                    <span class="pill ${j.direction === 'LONG' ? 'pill-buy' : 'pill-sell'}">${j.direction}</span>
                    <span class="font-bold ml-2">${j.ticker}</span>
                    <span class="text-xs text-slate-500 ml-2">${j.signal_id || ''}</span>
                </div>
                <div class="text-right text-xs text-slate-400">
                    ${(j.timestamp || '').slice(0, 10)}
                </div>
            </div>
            <div class="grid grid-cols-2 gap-x-4 gap-y-1 text-xs text-slate-300">
                <div>Entrée : <span class="text-slate-100">${j.price_at_signal?.toFixed(4) || '—'}</span></div>
                <div>${fermeture ? 'Sortie' : 'SL'} : <span class="text-slate-100">${(fermeture ? j.exit_price : j.stop_loss)?.toFixed(4) || '—'}</span></div>
                <div>TP1 : <span class="text-slate-100">${j.target_1?.toFixed(4) || '—'}</span></div>
                <div>Confiance : <span class="text-slate-100">${j.confidence || '—'}/10</span></div>
            </div>
            ${fermeture ? `
                <div class="mt-2 flex justify-between items-center">
                    <span class="text-xs text-slate-400">${j.duration || ''} ${j.correct || ''}</span>
                    <span class="${colorPnl(pnl)} font-bold">${pct(pnl)}</span>
                </div>` : `<div class="mt-2 text-xs text-slate-500">⏳ Position en cours ou signal non clôturé</div>`}
            ${j.reason ? `<div class="mt-2 text-xs text-slate-400 italic">${j.reason}</div>` : ""}
            ${j.lesson ? `<div class="mt-1 text-xs text-amber-300">📚 ${j.lesson}</div>` : ""}
        </div>`;
    }).join("");
}

load();
</script>
{% endblock %}
