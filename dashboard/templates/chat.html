{% extends "base.html" %}
{% block title %}Chat — AlphaSignal{% endblock %}

{% block content %}
<div class="card mb-3" style="height: 60vh; display: flex; flex-direction: column;">
    <div class="flex justify-between items-center mb-2">
        <h2 class="font-semibold">💬 Chat stratégique</h2>
        <button onclick="clearChat()" class="text-xs text-slate-400 hover:text-red-300">🗑️ Effacer</button>
    </div>
    <div id="messages" class="flex-1 overflow-y-auto space-y-3 text-sm pr-1">
        <div class="text-slate-400 text-xs italic">Pose ta question à AlphaSignal. Il connaît ton paper trading, ton portefeuille réel, et sa base théorique.</div>
    </div>
</div>

<div class="card mb-3">
    <div class="flex gap-2">
        <input id="input" placeholder="Pose ta question…" class="flex-1 bg-slate-800 border border-slate-700 rounded px-3 py-2 text-sm" onkeydown="if(event.key==='Enter')send()">
        <button onclick="send()" id="send-btn" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 rounded font-semibold">Envoyer</button>
    </div>
</div>

<!-- Suggestions -->
<div class="space-y-2">
    <div class="text-xs text-slate-400">Suggestions :</div>
    <div class="grid grid-cols-2 gap-2 text-xs">
        <button onclick="suggest('Comment se porte mon paper trading ?')" class="bg-slate-800 hover:bg-slate-700 text-slate-200 py-2 px-3 rounded text-left">Mon paper trading ?</button>
        <button onclick="suggest('Comment se porte mon portefeuille réel ?')" class="bg-slate-800 hover:bg-slate-700 text-slate-200 py-2 px-3 rounded text-left">Mon portefeuille réel ?</button>
        <button onclick="suggest('Le marché crypto va-t-il monter ?')" class="bg-slate-800 hover:bg-slate-700 text-slate-200 py-2 px-3 rounded text-left">Marché crypto ?</button>
        <button onclick="suggest('Devrais-je acheter NVDA ?')" class="bg-slate-800 hover:bg-slate-700 text-slate-200 py-2 px-3 rounded text-left">Acheter NVDA ?</button>
        <button onclick="suggest('Explique le ratio risque/récompense')" class="bg-slate-800 hover:bg-slate-700 text-slate-200 py-2 px-3 rounded text-left">R:R ?</button>
        <button onclick="suggest('Quelle est l\'asymétrie du trading ?')" class="bg-slate-800 hover:bg-slate-700 text-slate-200 py-2 px-3 rounded text-left">Asymétrie ?</button>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const msgEl = document.getElementById("messages");

function renderMsg(role, text) {
    const div = document.createElement("div");
    if (role === "user") {
        div.className = "flex justify-end";
        div.innerHTML = `<div class="bg-emerald-700/40 text-emerald-100 px-3 py-2 rounded-lg max-w-[80%] whitespace-pre-wrap">${text}</div>`;
    } else {
        div.className = "flex justify-start";
        div.innerHTML = `<div class="bg-slate-800 text-slate-100 px-3 py-2 rounded-lg max-w-[90%] whitespace-pre-wrap">${text}</div>`;
    }
    msgEl.appendChild(div);
    msgEl.scrollTop = msgEl.scrollHeight;
}

async function loadHistory() {
    const hist = await (await fetch("/api/chat/history")).json();
    msgEl.innerHTML = "";
    if (!hist.length) {
        msgEl.innerHTML = `<div class="text-slate-400 text-xs italic">Pose ta question à AlphaSignal…</div>`;
        return;
    }
    hist.forEach(m => renderMsg(m.role, m.message));
}

async function send() {
    const input = document.getElementById("input");
    const txt = input.value.trim();
    if (!txt) return;
    input.value = "";
    renderMsg("user", txt);
    document.getElementById("send-btn").disabled = true;
    const r = await fetch("/api/chat/message", {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({message: txt}),
    });
    const j = await r.json();
    if (j.error) renderMsg("assistant", "⚠️ " + j.error);
    else renderMsg("assistant", j.reponse);
    document.getElementById("send-btn").disabled = false;
}

function suggest(q) {
    document.getElementById("input").value = q;
    send();
}

async function clearChat() {
    if (!confirm("Effacer tout l'historique du chat ?")) return;
    await fetch("/api/chat/history", {method: "DELETE"});
    loadHistory();
}

loadHistory();
</script>
{% endblock %}
