{% extends "base.html" %}
{% block title %}Vue d'ensemble — AlphaSignal{% endblock %}

{% block content %}
<!-- KPIs -->
<div class="grid grid-cols-2 gap-3 mb-4">
    <div class="card">
        <div class="text-xs text-slate-400">Capital total</div>
        <div id="kpi-capital" class="text-2xl font-bold mt-1">—</div>
    </div>
    <div class="card">
        <div class="text-xs text-slate-400">Total value</div>
        <div id="kpi-value" class="text-2xl font-bold mt-1">—</div>
    </div>
    <div class="card">
        <div class="text-xs text-slate-400">P&L non-réalisé</div>
        <div id="kpi-pnl" class="text-2xl font-bold mt-1">—</div>
    </div>
    <div class="card">
        <div class="text-xs text-slate-400">Positions</div>
        <div id="kpi-pos" class="text-2xl font-bold mt-1">—</div>
    </div>
</div>

<!-- Equity curve -->
<div class="card mb-4">
    <h2 class="font-semibold mb-2">📈 Equity curve</h2>
    <canvas id="equityChart" height="180"></canvas>
</div>

<!-- Positions ouvertes -->
<div class="card">
    <h2 class="font-semibold mb-3">📌 Positions ouvertes</h2>
    <div id="positions-list" class="space-y-2 text-sm">
        <div class="skeleton h-12"></div>
        <div class="skeleton h-12"></div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const eur = (v) => (v >= 0 ? "+" : "") + v.toFixed(2) + "€";
const pct = (v) => (v >= 0 ? "+" : "") + v.toFixed(2) + "%";
const colorPnl = (v) => v >= 0 ? "text-emerald-400" : "text-red-400";

async function loadOverview() {
    const p = await (await fetch("/api/portfolio")).json();
    document.getElementById("kpi-capital").textContent = p.capital_total.toFixed(0) + "€";
    const valEl = document.getElementById("kpi-value");
    valEl.textContent = p.total_value.toFixed(2) + "€";
    valEl.className = "text-2xl font-bold mt-1 " + colorPnl(p.total_value - p.capital_total);
    const pnlEl = document.getElementById("kpi-pnl");
    pnlEl.textContent = eur(p.unrealized_pnl);
    pnlEl.className = "text-2xl font-bold mt-1 " + colorPnl(p.unrealized_pnl);
    document.getElementById("kpi-pos").textContent = `${p.open_positions_count}/${p.max_positions}`;

    const list = document.getElementById("positions-list");
    if (!p.open_positions || p.open_positions.length === 0) {
        list.innerHTML = `<div class="text-slate-400 text-center py-3">Aucune position ouverte</div>`;
    } else {
        list.innerHTML = p.open_positions.map(pos => `
            <a href="/portfolio" class="block p-3 rounded-lg bg-slate-800/60 border border-slate-700">
                <div class="flex justify-between items-center">
                    <div>
                        <span class="pill ${pos.direction === 'LONG' ? 'pill-buy' : 'pill-sell'}">${pos.direction}</span>
                        <span class="font-bold ml-2">${pos.ticker}</span>
                    </div>
                    <div class="text-right">
                        <div class="${colorPnl(pos.unrealized_pnl_pct || 0)}">${pos.unrealized_pnl_pct !== null ? pct(pos.unrealized_pnl_pct) : '—'}</div>
                        <div class="text-xs text-slate-400">${pos.invested_amount.toFixed(0)}€</div>
                    </div>
                </div>
            </a>`).join("");
    }
}

async function loadEquity() {
    const data = await (await fetch("/api/portfolio/history?limit=60")).json();
    const ctx = document.getElementById("equityChart").getContext("2d");
    new Chart(ctx, {
        type: "line",
        data: {
            labels: data.map(d => d.date),
            datasets: [{
                label: "Total value",
                data: data.map(d => d.total_value),
                borderColor: "#34d399",
                backgroundColor: "rgba(52, 211, 153, 0.1)",
                fill: true,
                tension: 0.3,
                pointRadius: 0,
            }],
        },
        options: {
            responsive: true,
            plugins: { legend: { display: false } },
            scales: {
                x: { ticks: { color: "#94a3b8", maxTicksLimit: 6 }, grid: { display: false } },
                y: { ticks: { color: "#94a3b8" }, grid: { color: "#334155" } },
            },
        },
    });
}

loadOverview();
loadEquity();
</script>
{% endblock %}
